<!--
  MODELLO EMAIL: "Reset Password" (Supabase > Authentication > Emails > Templates)
  Oggetto consigliato: Neon Campus · Scegli una nuova password
  Variabili Supabase usate: {{ .Email }}, {{ .SiteURL }}, {{ .TokenHash }}
-->
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#1a1336;padding:32px 12px;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:520px;background-color:#2b2160;border-radius:20px;overflow:hidden;">
        <tr>
          <td style="background-color:#ff79b0;background-image:linear-gradient(135deg,#5b4bb5,#ff79b0,#ffb08a);padding:28px 24px;text-align:center;">
            <p style="margin:0;font-size:28px;font-weight:bold;color:#ffffff;">Neon Campus</p>
            <p style="margin:4px 0 0;font-size:12px;letter-spacing:4px;color:#fbeff6;">FLORIDA ROLEPLAY</p>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 24px;color:#fbeff6;">
            <p style="margin:0 0 12px;font-size:20px;font-weight:bold;">Recupero password</p>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#d9cff5;">
              Abbiamo ricevuto una richiesta per cambiare la password dell'account <b style="color:#ffffff;">{{ .Email }}</b>.
              Clicca il pulsante per sceglierne una nuova.
            </p>
            <table cellpadding="0" cellspacing="0" role="presentation" align="center">
              <tr>
                <td style="border-radius:999px;background-color:#ff79b0;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/nuova-password"
                     style="display:inline-block;padding:14px 32px;font-size:16px;font-weight:bold;color:#24163f;text-decoration:none;">
                    Scegli una nuova password
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 24px;background-color:#221a4d;font-size:12px;line-height:1.5;color:#8f84c4;text-align:center;">
            Se non hai chiesto tu il recupero, ignora questa email: la tua password resta quella di prima.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
